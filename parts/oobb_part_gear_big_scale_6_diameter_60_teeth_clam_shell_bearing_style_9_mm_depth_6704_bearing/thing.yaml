          \nmodule oobb_gear_spur_raw(\n    teeth=16,\n    gear_mod=2,\n    thickness=8,\n\
          \    shaft_diam=0,\n    backlash=0,\n    gear_bevel=0\n) {\n    cp     =\
          \ gear_mod * PI;\n    tip_r  = outer_radius(circ_pitch=cp, teeth=teeth);\n\
          \    extra  = tip_r + gear_bevel + 2;\n    half_t = thickness / 2;\n\n \
